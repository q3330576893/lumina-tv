// gradle --offline -I app/src/test/java/com/lumina/tv/player/s2-checks.init.gradle :app:s2LanguageChecks
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('s2LanguageChecks', JavaExec) {
        def tests = app.tasks.named('compileDebugUnitTestKotlin')
        dependsOn tests
        classpath = app.files(tests.get().destinationDirectory,
            app.tasks.named('compileDebugKotlin').get().destinationDirectory, tests.get().libraries)
        mainClass = 'com.lumina.tv.player.S2LanguageChecks'
    }
}
