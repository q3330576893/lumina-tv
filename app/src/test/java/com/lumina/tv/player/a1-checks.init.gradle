// gradle --offline -I app/src/test/java/com/lumina/tv/player/a1-checks.init.gradle :app:a1ReliabilityChecks
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('a1ReliabilityChecks', JavaExec) {
        def tests = app.tasks.named('compileDebugUnitTestKotlin')
        dependsOn tests
        classpath = app.files(tests.get().destinationDirectory,
            app.tasks.named('compileDebugKotlin').get().destinationDirectory, tests.get().libraries)
        mainClass = 'com.lumina.tv.player.A1ReliabilityChecks'
    }
}
