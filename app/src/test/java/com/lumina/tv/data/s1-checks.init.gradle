// gradle --offline -I app/src/test/java/com/lumina/tv/data/s1-checks.init.gradle :app:s1SecurityChecks
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('s1SecurityChecks', JavaExec) {
        def tests = app.tasks.named('compileDebugUnitTestKotlin')
        dependsOn tests
        // These checks only need the already-cached compile dependencies and compiled classes.
        classpath = app.files(tests.get().destinationDirectory,
            app.tasks.named('compileDebugKotlin').get().destinationDirectory, tests.get().libraries)
        mainClass = 'com.lumina.tv.data.S1SecurityChecks'
    }
}
