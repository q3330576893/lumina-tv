// gradle --offline -I app/src/test/java/com/lumina/tv/data/s5-checks.init.gradle -Ps5JsonJar=<existing org.json jar> :app:s5WideImageChecks
// The JVM needs a real JSON implementation instead of android.jar's stubs. Use an existing
// local jar explicitly; this script adds no project dependency and downloads nothing.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('s5WideImageChecks', JavaExec) {
        def tests = app.tasks.named('compileDebugUnitTestKotlin')
        dependsOn tests
        def jsonJar = app.findProperty('s5JsonJar')
        if (!jsonJar || !app.file(jsonJar).isFile()) {
            throw new GradleException('Pass -Ps5JsonJar=<path to an existing org.json jar> for the JVM checks.')
        }
        classpath = app.files(jsonJar, tests.get().destinationDirectory,
            app.tasks.named('compileDebugKotlin').get().destinationDirectory, tests.get().libraries)
        mainClass = 'com.lumina.tv.data.S5WideImageChecks'
    }
}
